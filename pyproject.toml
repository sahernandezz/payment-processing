[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic revision files are autogenerated.
extend-exclude = ["*/alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI uses callables (Depends/Header/Query) in argument defaults by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/api/tests"]
